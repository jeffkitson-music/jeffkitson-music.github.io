<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delta Flight Link Utility</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #003268;
            --accent-bright: #E3132C;
            --accent-dark: #9B1631;
            --card-bg: #FFFFFF;
            --border-color: #E1E4EA;
            --text-dark: #1C2434;
            --text-muted: #637381;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        header h1 {
            color: #FFFFFF;
            font-size: 2.25rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        header p {
            color: rgba(255, 255, 255, 0.75);
            margin-top: 0.5rem;
            font-size: 1rem;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        /* Search Section */
        .search-box {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            margin-bottom: 2rem;
        }

        .input-group {
            position: relative;
            display: flex;
            align-items: center;
            margin-bottom: 1rem;
        }

        .flight-input {
            width: 100%;
            padding: 1.1rem 1.5rem;
            font-size: 1.25rem;
            font-weight: 600;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            outline: none;
            color: var(--bg-main);
            transition: border-color 0.2s ease;
            -webkit-appearance: none;
        }

        .flight-input:focus {
            border-color: var(--accent-bright);
        }

        /* Controls Button Grid */
        .controls-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 0.75rem;
        }

        button {
            cursor: pointer;
            font-weight: 600;
            border-radius: 10px;
            border: none;
            transition: all 0.2s ease;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }

        .btn-primary {
            background-color: var(--accent-bright);
            color: white;
            padding: 0.85rem 1.5rem;
        }

        .btn-primary:hover {
            background-color: var(--accent-dark);
        }

        .btn-secondary {
            background-color: #ffffff;
            color: var(--text-dark);
            border: 2px solid var(--border-color);
        }

        .btn-secondary:hover {
            background-color: #f8f9fa;
            border-color: #cbd5e1;
        }

        .btn-danger {
            background-color: #FFF1F2;
            color: var(--accent-bright);
            border: 2px solid #FFE4E6;
        }

        .btn-danger:hover {
            background-color: #FFE4E6;
            color: var(--accent-dark);
        }

        /* Cards List */
        .cards-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .flight-card {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 1.25rem 1.5rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: slideIn 0.3s ease forwards;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-info {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            overflow: hidden;
            padding-right: 1rem;
        }

        .card-title {
            font-weight: 700;
            color: var(--bg-main);
            font-size: 1.1rem;
        }

        .card-url {
            color: var(--text-muted);
            font-size: 0.85rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-actions {
            display: flex;
            gap: 0.5rem;
            flex-shrink: 0;
        }

        .card-actions button {
            padding: 0.6rem 1.2rem;
            font-size: 0.9rem;
        }

        .card-actions a {
            text-decoration: none;
        }

        /* Toast Alert styling */
        .toast {
            position: fixed;
            bottom: 24px;
            background: #1C2434;
            color: white;
            padding: 0.85rem 1.75rem;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 500;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
            pointer-events: none;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Mobile Responsive Rules */
        @media (max-width: 480px) {
            body {
                padding: 1rem 0.75rem;
            }

            header {
                margin-bottom: 1.75rem;
            }

            header h1 {
                font-size: 1.8rem;
            }

            .search-box {
                padding: 1rem;
                border-radius: 12px;
            }

            .flight-input {
                padding: 0.9rem 1.2rem;
                font-size: 1.1rem;
            }

            .controls-grid {
                grid-template-columns: 1fr;
                gap: 0.5rem;
            }

            button {
                padding: 0.85rem 1rem;
                width: 100%;
            }

            .flight-card {
                flex-direction: column;
                align-items: stretch;
                gap: 1rem;
                padding: 1.2rem;
            }

            .card-info {
                padding-right: 0;
            }

            .card-actions {
                width: 100%;
            }

            .card-actions a, 
            .card-actions button {
                flex: 1;
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Delta Flight Linker</h1>
        <p>Quick access to FlightAware tracking links</p>
    </header>

    <div class="container">
        <div class="search-box">
            <div class="input-group">
                <input type="text" id="flightInput" class="flight-input" placeholder="Enter Flight Number (e.g., 3889)" inputmode="numeric" pattern="[0-9]*" autofocus>
            </div>
            <div class="controls-grid">
                <button id="getLinkBtn" class="btn-primary">Get Link</button>
                <button id="clearBtn" class="btn-secondary">Clear</button>
                <button id="clearAllBtn" class="btn-danger">Clear All</button>
            </div>
        </div>

        <div id="cardsList" class="cards-list"></div>
    </div>

    <div id="toast" class="toast">Link copied to clipboard!</div>

    <script>
        const flightInput = document.getElementById('flightInput');
        const getLinkBtn = document.getElementById('getLinkBtn');
        const clearBtn = document.getElementById('clearBtn');
        const clearAllBtn = document.getElementById('clearAllBtn');
        const cardsList = document.getElementById('cardsList');
        const toast = document.getElementById('toast');

        function generateCard() {
            const rawValue = flightInput.value.trim();
            const flightNum = rawValue.replace(/^[a-zA-Z]+/, ''); 

            if (!flightNum) {
                alert('Please enter a valid flight number.');
                return;
            }

            const targetUrl = `https://www.flightaware.com/live/flight/DAL${flightNum}`;

            const card = document.createElement('div');
            card.className = 'flight-card';

            card.innerHTML = `
                <div class="card-info">
                    <div class="card-title">Delta Flight ${flightNum}</div>
                    <div class="card-url" title="${targetUrl}">${targetUrl}</div>
                </div>
                <div class="card-actions">
                    <button class="btn-secondary" onclick="copyToClipboard('${targetUrl}')">Copy</button>
                    <a href="${targetUrl}" target="_blank">
                        <button class="btn-primary">Visit</button>
                    </a>
                </div>
            `;

            cardsList.insertBefore(card, cardsList.firstChild);

            flightInput.value = '';
            flightInput.focus();
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                toast.classList.add('show');
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy text: ', err);
            });
        }

        getLinkBtn.addEventListener('click', generateCard);

        clearBtn.addEventListener('click', () => {
            flightInput.value = '';
            flightInput.focus();
        });

        clearAllBtn.addEventListener('click', () => {
            cardsList.innerHTML = '';
            flightInput.focus();
        });

        flightInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                generateCard();
            }
        });
    </script>
</body>
</html>
